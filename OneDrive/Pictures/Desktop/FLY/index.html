<!DOCTYPE html>
<html>
<head>
    <title>Font Properties</title>
    <style>
        h1 {
            font-family: Arial;
            font-size: 36px;
            font-weight: bold;
        }
        p {
            font-family: "Times New Roman";
            font-style: italic;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Page</h1>
    <p>This page demonstrates font properties using CSS.</p>
</body>
</html>
